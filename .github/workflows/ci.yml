name: Verification

# CI runs on pull_request, pushes to main, and explicit dispatch only:
# branch pushes are validated by their pull_request run and tag pushes point
# at commits main already validated — one suite run per change, no
# duplicates.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run: cancel it instead
# of letting a result nobody will read keep running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      # A red macOS run must not cancel the in-flight Linux run: the two
      # exercise different filesystem strategies, so each failure is its own
      # diagnosis.
      fail-fast: false
      # macOS exists for a reason the Linux job can never cover: the
      # anchored no-follow filesystem layer (engine/src/utils/
      # no-follow-fs.ts) takes a darwin branch (O_NOFOLLOW_ANY-proven real
      # path) that Linux CI never executes. Pin the newest standard macOS
      # runner. The darwin leg is the expensive one, which is why the
      # triggers above are trimmed to pull_request and main pushes — every run
      # this matrix gets is one that must exercise darwin.
      #
      # Each OS runs the one verify command once per Verify Slice
      # (engine/src/core/verify-slice.ts): typecheck and lint, each Vitest
      # file shard, and the smoke scripts run in parallel jobs. The slices
      # listed here together are the whole command, so every tier still runs
      # on both platforms; a run takes about as long as its slowest shard
      # instead of the whole suite.
      matrix:
        os: [ubuntu-24.04, macos-15]
        slice:
          - { name: static, value: static }
          - { name: unit-1-of-4, value: "unit:1/4" }
          - { name: unit-2-of-4, value: "unit:2/4" }
          - { name: unit-3-of-4, value: "unit:3/4" }
          - { name: unit-4-of-4, value: "unit:4/4" }
          - { name: smoke, value: smoke }
    runs-on: ${{ matrix.os }}
    name: verify (${{ matrix.os }}, ${{ matrix.slice.name }})
    # The engine unit suite alone runs ~8.5 minutes on a fast Linux box and
    # GitHub's macOS runners are materially slower; 30 minutes left no head
    # room for the macOS leg, so each job's budget is generous.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Required tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(node --version)" = v22.23.2
          test "$(bun --version)" = "$(cat .bun-version)"
          for tool in jq bash git node npm bun; do
            command -v "$tool"
          done
          jq --version
          git --version
          case "$(uname -s)" in
            Linux)
              test "$BASH_VERSINFO" -ge 4
              command -v timeout
              timeout --version
              ;;
            Darwin)
              # No GNU coreutils required: the smoke scripts already degrade
              # gracefully when `timeout` is absent.
              ;;
            *)
              echo "unexpected platform: $(uname -s)" >&2
              exit 1
              ;;
          esac
      - name: Install both locked dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd engine && bun install --frozen-lockfile)
      - name: Require locked local compiler, Vitest, and Pi
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/node_modules/typescript/lib/typescript.js
          test -x engine/node_modules/.bin/vitest
          test -x node_modules/.bin/pi
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          test "$(command -v pi)" = "$GITHUB_WORKSPACE/node_modules/.bin/pi"
          printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          node -p 'require("./engine/node_modules/typescript/package.json").version'
          node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version'
      # The security-audit sandbox's real-isolation tests prove its claims
      # (read-only target and home, no network, forged facts ignored) only
      # where `unshare` can make an unprivileged user namespace. Ubuntu 24.04
      # restricts that through AppArmor by default, which would turn those
      # tests into a console warning. Lift the restriction on the Linux leg and
      # make an unavailable sandbox FAIL the suite there (LOOM_REQUIRE_SANDBOX).
      # macOS has no `unshare`: its leg keeps the skip and never sets the flag.
      - name: Enable unprivileged user namespaces for the sandbox tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --map-root-user --mount --net true
          echo "LOOM_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: Verify
        shell: bash
        env:
          LOOM_VERIFY_SLICE: ${{ matrix.slice.value }}
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee verification.log
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-OS names: a shared name made the second leg's upload overwrite
          # (or collide with) the first's artifact.
          name: verification-log-${{ matrix.os }}-${{ matrix.slice.name }}
          path: verification.log
          if-no-files-found: warn
