name: Verification

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      # A red macOS run must not cancel the in-flight Linux run: the two
      # exercise different filesystem strategies, so each failure is its own
      # diagnosis.
      fail-fast: false
      # macOS exists for a reason the Linux job can never cover: the
      # anchored no-follow filesystem layer (engine/src/orchestration/
      # no-follow-fs.ts) takes a darwin branch (O_NOFOLLOW_ANY-proven real
      # path) that Linux CI never executes. Pin the newest standard macOS
      # runner; it is free on public repositories.
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The engine unit suite alone runs ~8.5 minutes on a fast Linux box and
    # GitHub's macOS runners are materially slower; 30 minutes left no head
    # room for the macOS leg, so the budget is shared and generous.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Required tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(node --version)" = v22.23.2
          test "$(bun --version)" = 1.3.13
          for tool in jq bash git node npm bun; do
            command -v "$tool"
          done
          jq --version
          git --version
          case "$(uname -s)" in
            Linux)
              test "$BASH_VERSINFO" -ge 4
              command -v timeout
              timeout --version
              ;;
            Darwin)
              # No GNU coreutils required: the smoke scripts already degrade
              # gracefully when `timeout` is absent.
              ;;
            *)
              echo "unexpected platform: $(uname -s)" >&2
              exit 1
              ;;
          esac
      - name: Install both locked dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd engine && bun install --frozen-lockfile)
      - name: Require locked local compiler, Vitest, and Pi
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/node_modules/typescript/lib/typescript.js
          test -x engine/node_modules/.bin/vitest
          test -x node_modules/.bin/pi
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          test "$(command -v pi)" = "$GITHUB_WORKSPACE/node_modules/.bin/pi"
          printf '%s\n' "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          node -p 'require("./engine/node_modules/typescript/package.json").version'
          node -p 'require("./node_modules/@earendil-works/pi-coding-agent/package.json").version'
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee verification.log
      - name: Retain verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-OS names: a shared name made the second leg's upload overwrite
          # (or collide with) the first's artifact.
          name: verification-log-${{ matrix.os }}
          path: verification.log
          if-no-files-found: warn
